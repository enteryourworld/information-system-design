serif" font-size="20" fill="#151515">capacity</text><text x="1376.0" y="359" font-family="Arial, sans-serif" font-size="20" fill="#151515">INTEGER</text><text x="1586.0" y="358" font-family="Arial, sans-serif" font-size="19" fill="#151515">NOT NULL</text><polyline points="1040,370 1740,370" stroke="#444444" stroke-width="1.5" fill="none"/><text x="1055" y="399" font-family="Arial, sans-serif" font-size="20" fill="#151515">current_price</text><text x="1376.0" y="399" font-family="Arial, sans-serif" font-size="20" fill="#151515">DECIMAL(12,2)</text><text x="1586.0" y="398" font-family="Arial, sans-serif" font-size="19" fill="#151515">NOT NULL</text><rect x="450" y="790" width="900" height="380" fill="white" stroke="#444444" stroke-width="1.5"/><rect x="450" y="790" width="900" height="60" fill="#eeeeee" stroke="#444444" stroke-width="1.5"/><text x="468" y="831" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#151515">STAY_RECORD · Проживание</text><polyline points="450,890 1350,890" stroke="#444444" stroke-width="1.5" fill="none"/><polyline points="864.0,850 864.0,1170" stroke="#444444" stroke-width="1.5" fill="none"/><polyline points="1134.0,850 1134.0,1170" stroke="#444444" stroke-width="1.5" fill="none"/><text x="465" y="879" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#151515">Поле</text><text x="878.0" y="879" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#151515">Тип</text><text x="1148.0" y="879" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#151515">Ключ / NULL</text><text x="465" y="919" font-family="Arial, sans-serif" font-size="20" fill="#151515">id_record</text><text x="878.0" y="919" font-family="Arial, sans-serif" font-size="20" fill="#151515">INTEGER</text><text x="1148.0" y="918" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#151515">PK</text><polyline points="450,930 1350,930" stroke="#444444" stroke-width="1.5" fill="none"
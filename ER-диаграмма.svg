" font-family="Arial, sans-serif" font-size="20" fill="#151515">agreed_price</text><text x="878.0" y="1159" font-family="Arial, sans-serif" font-size="20" fill="#151515">DECIMAL(12,2)</text><text x="1148.0" y="1158" font-family="Arial, sans-serif" font-size="19" fill="#151515">NOT NULL</text><polyline points="390,490 390,670 690,670 690,748" stroke="#444444" stroke-width="1.5" fill="none"/><polyline points="380,505 400,505" stroke="#444444" stroke-width="1.5" fill="none"/><polyline points="380,513 400,513" stroke="#444444" stroke-width="1.5" fill="none"/><circle cx="690" cy="755" r="7" fill="white" stroke="#444444" stroke-width="1.5"/><polyline points="690,762 690,790" stroke="#444444" stroke-width="1.5" fill="none"/><polyline points="679,790 690,770 701,790" stroke="#444444" stroke-width="1.5" fill="none"/><text x="408" y="542" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#151515">1</text><text x="710" y="756" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#151515">0..*</text><text x="395" y="644" font-family="Arial, sans-serif" font-size="20" fill="#151515">проживания клиента</text><polyline points="1410,410 1410,670 1110,670 1110,748" stroke="#444444" stroke-width="1.5" fill="none"/><polyline points="1400,425 1420,425" stroke="#444444" stroke-width="1.5" fill="none"/><polyline points="1400,433 1420,433" stroke="#444444" stroke-width="1.5" fill="none"/><circle cx="1110" cy="755" r="7" fill="white" stroke="#444444" stroke-width="1.5"/><polyline points="1110,762 1110,790" stroke="#444444" stroke-width="1.5" fill="none"/><polyline points="1099,790 1110,770 1121,790" stroke="#444444" stroke-width="1.5" fill="none"/><text x="1428" y="462" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#151515">1</text><text x="1130" y="756" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#151515">0..*</text><text x="1170" y="644" font-family="Arial, sans-serif" font-size="20" fill="#151515">размещения в номере</text><text x="60" y="1228" font-family="Arial, sans-serif" font-size="20" fill="#151515">PK — первичный ключ; FK — внешний ключ; UK — уникальный ключ. Поля PK и UK обязательны.</text><text x="60" y="1263" font-family="Arial, sans-serif" font-size="20" fill="#151515">STAY_RECORD.client_passport → CLIENT.passport; STAY_RECORD.id_room → HOTEL_ROOM.id_room.</text><text x="60" y="1298" font-family="Arial, sans-serif" font-size="20" fill="#151515">Одна запись — одно занятое место. Тарифы задаются за место/сутки; agreed_price фиксируется при заселении.</text><text x="60" y="1333" font-family="Arial, sans-serif" font-size="20" fill="#151515">Плановый выезд обязателен. Продление возможно при наличии свободного места на весь дополнительный срок.</text></svg>
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hotel_lab2
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel_lab2_dev
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel_lab2"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
